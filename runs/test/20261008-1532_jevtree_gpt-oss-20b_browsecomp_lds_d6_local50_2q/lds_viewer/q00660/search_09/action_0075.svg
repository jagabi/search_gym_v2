172c40">기록: Rank-only LDS selection; one candidate per root in this round</text><text x="40" y="1201" font-size="18" text-anchor="start" style="fill:#647387">실제 실행 로그 재생 · 완료된 요청/평가만 반영 · 원문·전체 후보·시각은 structure.json / actions.jsonl / pages/에 저장</text><text x="40" y="1240" font-size="18" text-anchor="start" style="fill:#647387">fetch 수는 논리적 요청 시도 수. 전송 계층의 HTTP 재시도는 포함하지 않는다. 부모로 돌아갈 때 재-fetch하지 않는다.</text></svg>