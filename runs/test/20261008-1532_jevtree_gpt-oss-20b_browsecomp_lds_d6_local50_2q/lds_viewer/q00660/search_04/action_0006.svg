<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1280" viewBox="0 0 1700 1280" role="img"><title>Action 6: 독해 및 검색 종료</title><style>text{font-family:"Malgun Gothic",sans-serif;fill:#172c40}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="43" font-size="31" text-anchor="start" style="fill:#172c40">Action #6 / 6  ·  독해 및 검색 종료</text><text x="40" y="86" font-size="22" text-anchor="start" style="fill:#172c40">검색어: &quot;encouraged to use a computer&quot; 1964 African university</text><text x="40" y="128" font-size="24" text-anchor="start" style="fill:#172c40">fetch 시도 0/40  ·  허용 이탈 0  ·  검색 시작 후 0.0초</text><text x="40" y="168" font-size="20" text-anchor="start" style="fill:#172c40">주황 = 이번 행동  /  파랑 = 요청한 페이지  /  빨강 = 실패·중복  /  +N = 발견한 대기 후보</text><line x1="65" y1="307" x2="1660" y2="307" stroke="#f1f3f5" stroke-width="2"/><text x="15" y="313" font-size="19" text-anchor="start" style="fill:#172c40">d1</text><line x1="65" y1="410" x2="1660" y2="410" stroke="#f1f3f5" stroke-width="2"/><text x="15" y="416" font-size="19" text-anchor="start" style="fill:#172c40">d2</text><line x1="65" y1="513" x2="1660" y2="513" stroke="#f1f3f5" stroke-width="2"/><text x="15" y="519" font-size="19" text-anchor="start" style="fill:#172c40">d3</text><line x1="65" y1="616" x2="1660" y2="616" stroke="#f1f3f5" stroke-width="2"/><text x="15" y="622" font-size="19" text-anchor="start" style="fill:#172c40">d4</text><line x1="65" y1="719" x2="1660" y2="719" stroke="#f1f3f5" stroke-width="2"/><text x="15" y="725" font-size="19" text-anchor="start" style="fill:#172c40">d5</text><line x1="65" y1="822" x2="1660" y2="822" stroke="#f1f3f5" stroke-width="2"/><text x="15" y="828" font-size="19" text-anchor="start" style="fill:#172c40">d6</text><line x1="40" y1="883" x2="1660" y2="883" stroke="#cad3df" stroke-width="2"/><text x="40" y="921" font-size="21" text-anchor="start" style="fill:#172c40">Search finished; reader notes saved</text><text x="40" y="1010" font-size="22" text-anchor="start" style="fill:#172c40">같은 차례의 뿌리들을 병렬 처리한다. 점수는 같은 부모 안에서의 순위에만 사용한다.</text><text x="40" y="1158" font-size="19" text-anchor="start" style="fill:#172c40">기록: Search finished; reader notes saved</text><text x="40" y="1201" font-size="18" text-anchor="start" style="fill:#647387">실제 실행 로그 재생 · 완료된 요청/평가만 반영 · 원문·전체 후보·시각은 structure.json / actions.jsonl / pages/에 저장</text><text x="40" y="1240" font-size="18" text-anchor="start" style="fill:#647387">fetch 수는 논리적 요청 시도 수. 전송 계층의 HTTP 재시도는 포함하지 않는다. 부모로 돌아갈 때 재-fetch하지 않는다.</text></svg>