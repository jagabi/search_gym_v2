:#172c40">5순위 n0037 · 0.11</text><text x="1470" y="1080" font-size="18" text-anchor="middle" style="fill:#172c40">이탈 1 · 대기</text><text x="40" y="1158" font-size="19" text-anchor="start" style="fill:#172c40">기록: Reveal ranked top-K candidates; discovery costs no fetch</text><text x="40" y="1201" font-size="18" text-anchor="start" style="fill:#647387">실제 실행 로그 재생 · 완료된 요청/평가만 반영 · 원문·전체 후보·시각은 structure.json / actions.jsonl / pages/에 저장</text><text x="40" y="1240" font-size="18" text-anchor="start" style="fill:#647387">fetch 수는 논리적 요청 시도 수. 전송 계층의 HTTP 재시도는 포함하지 않는다. 부모로 돌아갈 때 재-fetch하지 않는다.</text></svg>