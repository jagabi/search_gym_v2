6" stroke-width="2"/><text x="190" y="1048" font-size="20" text-anchor="middle" style="fill:#172c40">1순위 n0056 · 0.62</text><text x="190" y="1080" font-size="18" text-anchor="middle" style="fill:#172c40">이탈 0 · 평가 완료</text><rect x="364.0" y="1022.0" width="292" height="76" rx="6" fill="#f4f7fa" stroke="#c0cbd6" stroke-width="2"/><text x="510" y="1048" font-size="20" text-anchor="middle" style="fill:#172c40">2순위 n0057 · 0.56</text><text x="510" y="1080" font-size="18" text-anchor="middle" style="fill:#172c40">이탈 1 · 대기</text><rect x="684.0" y="1022.0" width="292" height="76" rx="6" fill="#f4f7fa" stroke="#c0cbd6" stroke-width="2"/><text x="830" y="1048" font-size="20" text-anchor="middle" style="fill:#172c40">3순위 n0058 · 0.38</text><text x="830" y="1080" font-size="18" text-anchor="middle" style="fill:#172c40">이탈 1 · 대기</text><rect x="1004.0" y="1022.0" width="292" height="76" rx="6" fill="#f4f7fa" stroke="#c0cbd6" stroke-width="2"/><text x="1150" y="1048" font-size="20" text-anchor="middle" style="fill:#172c40">4순위 n0059 · 0.38</text><text x="1150" y="1080" font-size="18" text-anchor="middle" style="fill:#172c40">이탈 1 · 대기</text><rect x="1324.0" y="1022.0" width="292" height="76" rx="6" fill="#f4f7fa" stroke="#c0cbd6" stroke-width="2"/><text x="1470" y="1048" font-size="20" text-anchor="middle" style="fill:#172c40">5순위 n0060 · 0.33</text><text x="1470" y="1080" font-size="18" text-anchor="middle" style="fill:#172c40">이탈 1 · 대기</text><text x="40" y="1158" font-size="19" text-anchor="start" style="fill:#172c40">기록: Page scores returned; candidates committed after this parallel round</text><text x="40" y="1201" font-size="18" text-anchor="start" style="fill:#647387">실제 실행 로그 재생 · 완료된 요청/평가만 반영 · 원문·전체 후보·시각은 structure.json / actions.jsonl / pages/에 저장</text><text x="40" y="1240" font-size="18" text-anchor="start" style="fill:#647387">fetch 수는 논리적 요청 시도 수. 전송 계층의 HTTP 재시도는 포함하지 않는다. 부모로 돌아갈 때 재-fetch하지 않는다.</text></svg>