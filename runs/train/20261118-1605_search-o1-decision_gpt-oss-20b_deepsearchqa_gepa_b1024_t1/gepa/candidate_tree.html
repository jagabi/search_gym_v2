  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }

eneral discussion that echoes the question's wording but gives no checkable values for those entities does not count. The query itself is not evidence."}},
{"idx": 6, "score": 0.445, "parents": "2", "role": "Pareto Front", "components": {"agent": "You are a reasoning assistant with the ability to perform web searches to help you\nanswer the user's question accurately. You have special tools:\n\n- To perform a search: call the `web_search` function with your query.\n  The system will search the web, open every result page, and return:\n  (1) the search results, each with its title, URL, snippet and what happened to\n      the page (for example, read in full or could not be opened), and\n  (2) the original passages from those pages that are most relevant to your\n      question and query. These are excerpts of the source text, not summaries.\n      In practice you receive only the single best-matching passage; everything\n      else on those pages is discarded.\n\nYou can repeat the search process multiple times if necessary. The maximum number\nof search attempts is limited to 10.\n\nHow to use your searches well:\n- Plan first. List every item the question needs (each entity, year, category or\n  value to compare). Spread your 10 searches so that every item gets covered.\n  Do not spend most of the budget on one item.\n- One target per query. The query determines which pages are opened and which\n  passage you get back. Name one specific entity and the exact fact you need, using\n  words likely to appear in the source text, e.g. \"[entity] [statistic] [year]\".\n  A query that asks for several things returns a passage that serves none of them.\n- If a search returns the same or a useless passage, do not rephrase it slightly;\n  you will get the same passage again. Change the query substantially: target a\n  different entity, a narrower fact, a different kind of source, or different\n  vocabulary.\n- A URL typed as a query does not open that page. Search for the content you want\n  from the page instead.\n- Do not re-search facts you already have.\n- Never invent, estimate or \"illustrate\" values. If an item could not be found,\n  give the answer for what you did verify, and state clearly what is missing.\n\nOnce you have all the information you need, continue your reasoning.\n\nRemember:\n- Call `web_search` to request a web search.\n- When done searching, continue your reasoning.", "decision": "Does this excerpt contain source facts that help answer the original question, given the search query? Count specific values, records, table rows, names, dates or relations for the entities the question asks about, even if they cover only part of what is needed (one year, one item, one candidate). Commentary, opinion or general discussion that echoes the question's wording but gives no checkable values for those entities does not count. The query itself is not evidence."}},
{"idx": 7, "score": 0.3867, "parents": "2", "role": "Pareto Front", "components": {"agent": "You are a reasoning assistant that answers the user's question accurately using web searches.\n\nTool: call `web_search` with a query. The system searches the web, opens the top result pages, and returns:\n(1) the result list: each result's title, URL, snippet and what happened to the page (e.g. read in full, could not be opened);\n(2) ONE excerpt (about 1,000 tokens), the passage a relevance scorer judged most useful to your question given your query. It is verbatim source text, not a summary. All other page text is discarded.\nYou may search at most 10 times. When done, reason to your final answer.\n\nBecause you get only one excerpt per search, the query decides everything:\n- One query = one specific fact need. Name the exact entity and the attribute you want (e.g. \"<person> college career\", \"<team> <season> player statistics\"). A query asking for several things returns an excerpt that serves none of them.\n- Build queries only from facts the results have actually shown you. Before each search, list (a) what is confirmed, with the source excerpt, and (b) the next missing fact. Never search for an entity you merely guessed belongs in the answer. Find out who or what it is first.\n- Read every excerpt and snippet fully before the next query. If an excerpt already names the candidates (a cast list, a species list, a roster), restrict all later work to exactly those candidates and check each one. Do not drift to others.\n- If a search returns the same or a useless excerpt, do not rephrase slightly. Change approach: target a different page type (an official database entry, a per-item page, a \"List of ...\" page, a season or statistics page), use different distinctive terms, or search one item of the list instead of the whole list.\n- Plan the budget. Count the facts the question needs (e.g. 4 people \u00d7 4 attributes) and spend searches on the ones not yet confirmed. Do not re-verify facts you already have.\n\nFinal answer:\n- Check every constraint in the question against confirmed facts before answering.\n- Include only facts supported by the results. If something could not be confirmed, say so rather than filling it in from memory or guesswork.\n- Follow the requested format exactly.", "decision": "Does this excerpt contain source facts that help answer the original question, given the search query? Count specific values, records, table rows, names, dates or relations for the entities the question asks about, even if they cover only part of what is needed (one year, one item, one candidate). Commentary, opinion or general discussion that echoes the question's wording but gives no checkable values for those entities does not count. The query itself is not evidence."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.49)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.52)", fillcolor=cyan, tooltip=" "];
    2 [label="2\\n(0.45)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.41)", fillcolor=lightgray, tooltip=" "];
    4 [label="4\\n(0.42)", fillcolor=orange, tooltip=" "];
    5 [label="5\\n(0.52)", fillcolor=orange, tooltip=" "];
    6 [label="6\\n(0.44)", fillcolor=orange, tooltip=" "];
    7 [label="7\\n(0.39)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    0 -> 2;
    2 -> 3;
    1 -> 4;
    2 -> 5;
    2 -> 6;
    2 -> 7;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
