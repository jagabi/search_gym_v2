# DepthSearch — RAgent + Reason-in-Documents + 재귀 확장.
#
# web_search + web_fetch는 ragent와 같은 검색 통제를 따른다. DepthSearch는
# 출처별 근거 추출·원문 링크 재귀 탐색·전용 프롬프트를 사용한다.
#
#   ragent       web_fetch → jina 마크다운 원문이 그대로 메인 컨텍스트에
#   depthsearch  web_fetch → explorer 노트 + 짧은 구조화 자료의 원문을 메인에
#                            explorer 는 그 페이지의 링크를 따라 재귀할 수 있다
#
# 아래는 구조 차이이며, 실제 방법 비교에는 전용 프롬프트도 포함된다.
#   ragent            → depthsearch(max_depth 1)   원문 vs 요약
#   depthsearch(1)    → depthsearch(3)             평면 vs 재귀
#
# 확장 노드(depth 2 이상)는 예산에서 차감한다. 메인 모델이 고른 페치(depth 1)는
# ragent 에도 똑같이 있으므로 차감하지 않는다 — 차감하면 두 조건의 행동이 달라진다.
#
# 제약은 프롬프트가 아니라 구조로 건다. explorer 는 max_depth 에 닿거나 예산이
# 소진되면 fetch 도구를 **아예 받지 않는다**.

agent:
  base_url: http://127.0.0.1:8000/v1
  max_tokens: 8192
  max_turns: 40
  timeout_s: 600

  # 검색 예산. 세 방법이 같은 값을 써야 비교가 성립한다.
  #
  # 검색량별 점수는 문항 난이도와 섞여 있다. 정보 전달 개선을 비교하는 동안 고정한다.
  max_searches: 10
  max_fetches: 0                # 0 = 무제한. 메인 모델의 페치는 막지 않는다
  search_results: 10            # serper 가 돌려주는 결과 수. 모델이 보고 고른다
  search_top_k: 0               # 자동 페치 없음. search-o1 만 쓴다

  # 페치한 원문의 공통 토큰 상한. 세 방법에 동일하게 적용한다.
  fetch_max_tokens: 32768

  # 대화 컨텍스트 상한. **팟의 --max-model-len 에서 max_tokens 를 뺀 값이어야 한다.**
  #   131072(--max-model-len) - 8192(max_tokens) = 122880
  # 이 둘은 항상 같이 움직인다. 팟을 65536 으로 내리면 여기도 57344 로 내린다.
  context_limit: 122880
  finalize_answer: true        # 탐색 초안과 근거 연결을 유지하며 최종 검토
  # 프로토콜 복구 재시도 상한. **세 방법이 같아야 한다** — 모델이 툴콜을 평문
  # JSON 으로 흘리는 것은 방법의 성질이 아니라 gpt-oss 의 버릇이라, 베이스라인만
  # 낮게 두면 방법 차이가 아니라 구현 차이로 점수가 갈린다.
  # 검색·페치 예산이 남아 있을 때만 발동하고 턴만 더 쓴다(예산 밖으로 새지 않는다).
  max_tool_recoveries: 2

explorer:
  max_depth: 3
  extract_before_expand: true   # 현재 페이지 근거를 먼저 저장한 뒤 링크 탐색
  isolate_extraction_context: true  # 추출 입력에는 부모 노트/누적 추론을 넣지 않는다
  prune_unhelpful_branches: true    # 무관한 가지와 같은 내용의 재귀를 중단

  # 확장 예산. **depth 2 이상만 센다.**
  # 문항 전체의 depth>=2 노드 총량.
  #
  # 과거 summary는 빈 응답을 분모에서 제외했다. 새 F1은 전체 문항 기준이다.
  max_expansion_nodes: 12
  max_subtree_children: 2       # explorer 하나가 열 수 있는 자식 수
  max_turns: 6                  # reader의 탐색 턴 상한
  max_root_nodes: 6            # 한 진입 페이지가 문항 전체 예산을 독식하지 않음

  # 열 만한 링크를 몇 개 보여 줄 것인가. 실측으로 페이지 하나에 링크가
  # 250~921개라 모델이 훑지 못하고 주소를 지어냈다(확장의 93%가 URL 추론,
  # dead dive 94%). 질의와 겹치는 순으로 추려 목록으로 보여 준다.
  # 열 만한 링크를 질의 관련도 순으로 추려 **본문 앞에** 보여 준다.
  # 0 이면 목록을 붙이지 않는다. 메뉴 밖의 본문 링크도 그대로 열 수 있다.
  max_link_menu: 30

  # 정제 출력 상한. 추출 작업이라 실제로는 1~2K 면 충분하다. 크게 잡으면
  # 문서 예산과 합쳐 컨텍스트를 넘기므로 8192 로 둔다.
  # DS는 이미 읽은 PDF/CSV/표 원문도 이 토큰 수 안에 들어갈 때만 별도로 보존한다.
  max_tokens: 8192
  # explorer 는 페이지를 하나씩 받으므로 이 값이 그대로 그 페이지의 상한이다.
  # 상한을 넘는 문서는 절단 표시가 붙는다. 미노출 부분은 미확인이다.
  max_document_tokens: 32768
  # explorer 세션 하나의 컨텍스트 상한(자기 페이지 + 자식 요약 누적).
  context_limit: 122880

# DepthSearch 전용 정책. RAgent와 프롬프트도 달라지므로 최적화된 방법으로 비교한다.
system_prompt: |
  Answer the question using web_search and web_fetch. Ground your answer in the
  sources. web_fetch returns source-labelled notes and may recursively follow links.

  Track candidates and required conditions as supported, contradicted or unknown.
  Once promising candidates are found, fill their missing conditions while widening
  coverage as needed; do not wait for an exhaustive candidate list to validate any
  item. Choose the next action for the unresolved condition it can establish.

  Search with a few source/topic terms for an entry page or a missing fact. Do not
  put unverified answer values into queries. Read useful result links, including
  official indexes that lead to documents, before searching for the same evidence
  again. If queries or URL variants yield the same material, switch to a detail
  link, another source or another missing condition.

  After a recursive return, integrate new facts into the original question's
  candidate/condition map. A reader's status and source scope do not settle the
  whole question. Use preserved source rows when a summary omits values. Match
  entity, year, unit, population and variant; missing evidence is not exclusion.

  Give the best-supported answer in the requested format. Deductions across sources
  are valid when their premises support the conclusion; no source must state the
  final answer verbatim. Retain supported answer items even if the full set remains
  incomplete, briefly qualifying coverage. Do not invent missing attributes or treat
  a partial sample as a global ranking. Include requested attributes and ordering;
  keep working notes out of names-only answers. Cite real source URLs.

explorer_prompt: |
  Read pages for a research assistant and follow useful links recursively. During
  extraction, only the supplied page is evidence. The question defines what to look
  for; parent reasoning guides navigation but is not this page's evidence.

  Preserve exact relevant names and rows with their headers, values, units, dates
  and scope. Never replace relevant rows with ellipses, examples or instructions to
  continue the list. If all rows cannot fit, prioritize rows useful to the question
  and explicitly mark omissions. A partial, restricted or truncated list is not the
  complete candidate set. Missing fields are unknown. Keep relevant discoveries even
  if they answer a different part of the original question.

  Follow links likely to fill a candidate's missing condition or reach the required
  document/year. An index can be useful without answer facts. If content repeats,
  try a detail page or another supported route. Links outside the menu and inferred
  paths on an observed site are allowed. Child notes are returned automatically;
  do not copy their facts into your own note. Retain useful unvisited links even
  when expansion stops.

  For extraction return:
  **Final Information**
  **Page:** Actual title and URL.
  **Evidence:** Exact relevant facts/rows and short supporting quotes.
  **Coverage:** Actual entities, years, population; full list, subset or excerpt.
  **Missing:** Requested fields this page does not establish.
  **Next links:** Useful URLs and the missing field each could establish.
  **Expand:** yes or no, and why.
  **Status:** partial
  Use answered only if this page supplies all requested facts, partial for useful
  incomplete evidence, or not_found with a brief reason. During navigation, call
  web_fetch or reply DONE.
