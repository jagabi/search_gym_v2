# 평가 설정 — 학습과 완전히 분리돼 있다.
#   python eval.py --config configs/eval.yaml --tag baseline
#   python eval.py --prompt runs/train/.../prompt.txt --tag optimized
#   python eval.py --benchmark evobrowsecomp --limit 20     # 소규모 확인
#
# 산출물: runs/eval/{날짜}_{모델}_{벤치}_{태그}/summary.json

# ---------------------------------------------------------------------------
# 평가 대상 모델과 에이전트 설정.
# **학습 때와 같은 값이어야 비교가 성립한다.** 특히 검색 예산이 다르면 다른 조건의
# 실험을 비교하게 된다.
# ---------------------------------------------------------------------------
model: gemma

agent:
  base_url: http://127.0.0.1:8000/v1
  max_tokens: 8192              # 한 턴의 출력 상한. 사고 토큰이 여기서 나간다
  max_searches: 20
  # 0 = 무제한. 페치는 Search-o1 정제를 거쳐 짧게 들어가므로 막지 않는다.
  max_fetches: 0
  max_turns: 40
  # 대화 컨텍스트 상한. 서버의 --max-model-len에서 답변 여유를 뺀 값이다
  # (128000 - 8000). 도구 결과가 이 선을 넘기면 남은 만큼만 잘라 넣고 답을 강제한다.
  context_limit: 120000
  refine_fetched: true
  # 정제기의 출력 상한. 상한이지 목표가 아니다 — 대부분의 정제는 한참 못 미친다.
  refine_max_tokens: 32768
  # 정제기에 넣을 원문의 **토큰** 상한. 도구 서버는 모델을 모르니 자 단위로만
  # 자르고(.env의 FETCH_MAX_CHARS), 토큰 절단은 모델을 아는 에이전트가 한다.
  refine_max_document_tokens: 50000
  reasoning_effort: ""
  # 확장 사고. 모델마다 기본값이 반대라(gemma-4 OFF / qwen3.5 ON) 명시해야
  # 세 모델 비교가 성립한다. null이면 서버 기본값에 맡긴다.
  enable_thinking: true          # 비우면 프로파일 기본값 (gpt-oss = medium)
  timeout_s: 600

# ---------------------------------------------------------------------------
# 평가할 시스템 프롬프트.
#   prompt_path  파일에서 읽는다 (train.py가 남긴 prompt.txt)
#   prompt_text  YAML에 직접 적는다 (prompt_path보다 우선)
#   둘 다 비우면 시스템 프롬프트 없이 도는 대조군이 된다.
# ---------------------------------------------------------------------------
prompt_path: ""
prompt_text: ""

# ---------------------------------------------------------------------------
# 평가 대상. 이름은 benchmarks 레지스트리에 있는 것만 쓸 수 있다.
#   path를 비우면 data/<이름>/test.json
#   limit: 0 이면 건너뛴다, null이면 전부
#
# 학습은 deepsearchqa에서만 하고 나머지는 OOD 일반화 확인용이다.
# ---------------------------------------------------------------------------
datasets:
  - name: deepsearchqa
    path: data/deepsearchqa/test.json
    limit: null
  - name: evobrowsecomp
    path: data/evobrowsecomp/test.json
    limit: null
  - name: browsecomp
    path: data/browsecomp/test.json
    limit: 0
  - name: kbrowsecomp
    path: data/kbrowsecomp/test.json
    limit: 0

judge:
  model: gemini-3.6-flash
  thinking_level: low

run:
  tag: ""
  output_dir: runs
  seed: 0
  cache: true
  workers: 1                    # 1 = 시리얼. vLLM --max-num-seqs와 맞춘다
