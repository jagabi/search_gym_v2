l="#e7f1fc" stroke="#a7b6c5" stroke-width="2"/><text x="193" y="978" font-size="22" text-anchor="middle" font-weight="bold">1순위  n16  ·  0.19</text><text x="193" y="1012" font-size="20" text-anchor="middle">경로 이탈 1회 / 허용 2회</text><text x="193" y="1041" font-size="18" text-anchor="middle">fetch 완료</text><rect x="369.5" y="945.5" width="291" height="109" rx="7" fill="#e7f1fc" stroke="#d27816" stroke-width="2"/><text x="515" y="978" font-size="22" text-anchor="middle" font-weight="bold">2순위  n17  ·  0.16</text><text x="515" y="1012" font-size="20" text-anchor="middle">경로 이탈 2회 / 허용 2회</text><text x="515" y="1041" font-size="18" text-anchor="middle">fetch 완료</text><rect x="691.5" y="945.5" width="291" height="109" rx="7" fill="#fff" stroke="#a7b6c5" stroke-width="2"/><text x="837" y="978" font-size="22" text-anchor="middle" font-weight="bold">3순위  n18  ·  0.15</text><text x="837" y="1012" font-size="20" text-anchor="middle">경로 이탈 2회 / 허용 2회</text><text x="837" y="1041" font-size="18" text-anchor="middle">대기</text><rect x="1013.5" y="945.5" width="291" height="109" rx="7" fill="#fff" stroke="#a7b6c5" stroke-width="2"/><text x="1159" y="978" font-size="22" text-anchor="middle" font-weight="bold">4순위  n19  ·  0.14</text><text x="1159" y="1012" font-size="20" text-anchor="middle">경로 이탈 2회 / 허용 2회</text><text x="1159" y="1041" font-size="18" text-anchor="middle">대기</text><rect x="1335.5" y="945.5" width="291" height="109" rx="7" fill="#fff" stroke="#a7b6c5" stroke-width="2"/><text x="1481" y="978" font-size="22" text-anchor="middle" font-weight="bold">5순위  n20  ·  0.13</text><text x="1481" y="1012" font-size="20" text-anchor="middle">경로 이탈 2회 / 허용 2회</text><text x="1481" y="1041" font-size="18" text-anchor="middle">대기</text><text x="45" y="1110" font-size="24" text-anchor="start" font-weight="bold">다음 행동: JEV: n17에서 자식 후보 5개 확인</text><text x="45" y="1160" font-size="19" text-anchor="start" style="fill:#68778b">후보 점수 묶음은 실제 로그 분포에서 재추출한 가상 값. 자식은 fetch 후 JEV 평가 때만 공개한다.</text><text x="45" y="1197" font-size="18" text-anchor="start" style="fill:#68778b">대기 후보는 트리에서 +N으로 묶고, 현재 갈림길의 개별 점수는 아래에 펼쳐 표시했다. 깊이 4~6은 분포 외삽이다.</text></svg>