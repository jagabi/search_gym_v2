<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1230" viewBox="0 0 1700 1230" role="img"><title>Action 26: 이탈 1회까지 허용하고 탐색</title><style>text{font-family:"Malgun Gothic",sans-serif;fill:#192a3d} .small{fill:#5b697b}</style><rect width="100%" height="100%" fill="#fff"/><text x="45" y="48" font-size="32" text-anchor="start" font-weight="bold">Action #026 / 127  ·  이탈 1회까지 허용하고 탐색</text><text x="45" y="91" font-size="22" text-anchor="start">이탈 0회 이하에서 갈 곳이 끝났다. 허용량을 올리고, 저장된 후보에서 대안을 찾는다. 재-fetch는 하지 않는다.</text><text x="45" y="137" font-size="25" text-anchor="start" font-weight="bold">fetch 7/40회     JEV 8회     허용 이탈 1회     최대 깊이 6</text><text x="45" y="178" font-size="20" text-anchor="start">주황 = 이번 대상  /  파랑 채움 = fetch 완료  /  빈 상자 = 미방문  /  +N = 발견했지만 아직 열지 않은 후보</text><text x="45" y="219" font-size="20" text-anchor="start" font-weight="bold">검색 10개</text><rect x="170.5" y="188.5" width="129" height="47" rx="7" fill="#e8f1fb" stroke="#3778b8" stroke-width="2"/><text x="235" y="219" font-size="20" text-anchor="middle">R1  0.81</text><rect x="315.5" y="188.5" width="129" height="47" rx="7" fill="#e8f1fb" stroke="#3778b8" stroke-width="2"/><text x="380" y="219" font-size="20" text-anchor="middle">R2  0.62</text><rect x="460.5" y="188.5" width="129" height="47" rx="7" fill="#e8f1fb" stroke="#3778b8" stroke-width="2"/><text x="525" y="219" font-size="20" text-anchor="middle">R3  0.52</text><rect x="605.5" y="188.5" width="129" height="47" rx="7" fill="#e8f1fb" stroke="#3778b8" stroke-width="2"/><text x="670" y="219" font-size="20" text-anchor="middle">R4  0.47</text><rect x="750.5" y="188.5" width="129" height="47" rx="7" fill="#e8f1fb" stroke="#3778b8" stroke-width="2"/><text x="815" y="219" font-size="20" text-anchor="middle">R5  0.43</text><rect x="895.5" y="188.5" width="129" height="47" rx="7" fill="#f2f3f5" stroke="#ccd2da" stroke-width="2"/><text x="960" y="219" font-size="20" text-anchor="middle">R6  0.38</text><rect x="1040.5" y="188.5" width="129" height="47" rx="7" fill="#f2f3f5" stroke="#ccd2da" stroke-width="2"/><text x="1105" y="219" font-size="20" text-anchor="middle">R7  0.37</text><rect x="1185.5" y="188.5" width="129" height="47" rx="7" fill="#f2f3f5" stroke="#ccd2da" stroke-width="2"/><text x="1250" y="219" font-size="20" text-anchor="middle">R8  0.31</text><rect x="1330.5" y="188.5" width="129" height="47" rx="7" fill="#f2f3f5" stroke="#ccd2da" stroke-width="2"/><text x="1395" y="219" font-size="20" text-anchor="middle">R9  0.29</text><rect x="1475.5" y="188.5" width="129" height="47" rx="7" fill="#f2f3f5" stroke="#ccd2da" stroke-width="2"/><text x="1540" y="219" font-size="20" text-anchor="middle">R10  0.19</text><text x="24" y="308" font-size="19" text-anchor="start" style="fill:#68778b">d1</text><line x1="67" y1="300" x2="1650" y2="300" stroke="#f0f2f5" stroke-width="2"/><text x="24" y="412" font-size="19" text-anchor="start" style="fill:#68778b">d2</text><line x1="67" y1="404" x2="1650" y2="404" stroke="#f0f2f5" stroke-width="2"/><text x="24" y="516" font-size="19" text-anchor="start" style="fill:#68778b">d3</text><line x1="67" y1="508" x2="1650" y2="508" stroke="#f0f2f5" stroke-width="2"/><text x="24" y="620" font-size="19" text-anchor="start" style="fill:#68778b">d4</text><line x1="67" y1="612" x2="1650" y2="612" stroke="#f0f2f5" stroke-width="2"/><text x="24" y="724" font-size="19" text-anchor="start" style="fill:#68778b">d5</text><line x1="67" y1="716" x2="1650" y2="716" stroke="#f0f2f5" stroke-width="2"/><text x="24" y="828" font-size="19" text-anchor="start" style="fill:#68778b">d6</text><line x1="67" y1="820" x2="1650" y2="820" stroke="#f0f2f5" stroke-width="2"/><line x1="736.6842105263158" y1="323" x2="658.263157894737" y2="381" stroke="#c4cdd7" stroke-width="2"/><line x1="1426.7894736842106" y1="323" x2="1348.3684210526317" y2="381" stroke="#c4cdd7" stroke-width="2"/><line x1="736.6842105263158" y1="323" x2="815.1052631578948" y2="386" stroke="#b8c2ce" stroke-width="2" stroke-dasharray="4 5"/><rect x="789.6052631578948" y="386.5" width="51" height="35" rx="7" fill="#f3f5f7" stroke="#c4cdd7" stroke-width="2"/><text x="815.1052631578948" y="410" font-size="18" text-anchor="middle">+4</text><line x1="1426.7894736842106" y1="323" x2="1505.2105263157896" y2="386" stroke="#b8c2ce" stroke-width="2" stroke-dasharray="4 5"/><rect x="1479.7105263157896" y="386.5" width="51" height="35" rx="7" fill="#f3f5f7" stroke="#c4cdd7" stroke-width="2"/><text x="1505.2105263157896" y="410" font-size="18" text-anchor="middle">+4</text><rect x="91.5" y="275.5" width="67" height="49" rx="7" fill="#e7f1fc" stroke="#3976ad" stroke-width="2"/><text x="125.0" y="297" font-size="17" text-anchor="middle" font-weight="bold">R1</text><text x="125.0" y="317" font-size="16" text-anchor="middle">0.81</text><text x="125.0" y="342" font-size="14" text-anchor="middle" style="fill:#677689">후보 없음</text><rect x="358.13157894736844" y="275.5" width="67" height="49" rx="7" fill="#e7f1fc" stroke="#3976ad" stroke-width="2"/><text x="391.63157894736844" y="297" font-size="17" text-anchor="middle" font-weight="bold">R2</text><text x="391.63157894736844" y="317" font-size="16" text-anchor="middle">0.62</text><text x="391.63157894736844" y="342" font-size="14" text-anchor="middle" style="fill:#677689">후보 없음</text><rect x="624.763157894737" y="379.5" width="67" height="49" rx="7" fill="#e7f1fc" stroke="#3976ad" stroke-width="2"/><text x="658.263157894737" y="401" font-size="17" text-anchor="middle" font-weight="bold">n01</text><text x="658.263157894737" y="421" font-size="16" text-anchor="middle">0.26</text><text x="658.263157894737" y="446" font-size="14" text-anchor="middle" style="fill:#677689">후보 없음</text><rect x="703.1842105263158" y="275.5" width="67" height="49" rx="7" fill="#e7f1fc" stroke="#3976ad" stroke-width="2"/><text x="736.6842105263158" y="297" font-size="17" text-anchor="middle" font-weight="bold">R3</text><text x="736.6842105263158" y="317" font-size="16" text-anchor="middle">0.52</text><rect x="1048.2368421052631" y="275.5" width="67" height="49" rx="7" fill="#e7f1fc" stroke="#3976ad" stroke-width="2"/><text x="1081.7368421052631" y="297" font-size="17" text-anchor="middle" font-weight="bold">R4</text><text x="1081.7368421052631" y="317" font-size="16" text-anchor="middle">0.47</text><text x="1081.7368421052631" y="342" font-size="14" text-anchor="middle" style="fill:#677689">후보 없음</text><rect x="1314.8684210526317" y="379.5" width="67" height="49" rx="7" fill="#e7f1fc" stroke="#3976ad" stroke-width="2"/><text x="1348.3684210526317" y="401" font-size="17" text-anchor="middle" font-weight="bold">n06</text><text x="1348.3684210526317" y="421" font-size="16" text-anchor="middle">0.28</text><text x="1348.3684210526317" y="446" font-size="14" text-anchor="middle" style="fill:#677689">후보 없음</text><rect x="1393.2894736842106" y="275.5" width="67" height="49" rx="7" fill="#e7f1fc" stroke="#3976ad" stroke-width="2"/><text x="1426.7894736842106" y="297" font-size="17" text-anchor="middle" font-weight="bold">R5</text><text x="1426.7894736842106" y="317" font-size="16" text-anchor="middle">0.43</text><line x1="45" y1="886" x2="1655" y2="886" stroke="#c4cdd7" stroke-width="2"/><text x="45" y="928" font-size="25" text-anchor="start" font-weight="bold">진행 규칙</text><text x="45" y="971" font-size="23" text-anchor="start">시작점 5개는 모두 이탈 0. 이후 1순위는 +0, 다른 순위는 +1. 뿌리별 fetch 기회는 번갈아 준다.</text><text x="45" y="1017" font-size="22" text-anchor="start">갈 곳이 없으면 허용 이탈을 늘린다. 이는 고정한 예시 정책이며 현재 서비스 코드의 동작은 아니다.</text><text x="45" y="1110" font-size="24" text-anchor="start" font-weight="bold">다음 행동: R3 차례: n02 선택</text><text x="45" y="1160" font-size="19" text-anchor="start" style="fill:#68778b">후보 점수 묶음은 실제 로그 분포에서 재추출한 가상 값. 자식은 fetch 후 JEV 평가 때만 공개한다.</text><text x="45" y="1197" font-size="18" text-anchor="start" style="fill:#68778b">대기 후보는 트리에서 +N으로 묶고, 현재 갈림길의 개별 점수는 아래에 펼쳐 표시했다. 깊이 4~6은 분포 외삽이다.</text></svg>