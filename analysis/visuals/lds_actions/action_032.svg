<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1230" viewBox="0 0 1700 1230" role="img"><title>Action 32: JEV: n07에서 자식 후보 0개 확인</title><style>text{font-family:"Malgun Gothic",sans-serif;fill:#192a3d} .small{fill:#5b697b}</style><rect width="100%" height="100%" fill="#fff"/><text x="45" y="48" font-size="32" text-anchor="start" font-weight="bold">Action #032 / 127  ·  JEV: n07에서 자식 후보 0개 확인</text><text x="45" y="91" font-size="22" text-anchor="start">후보 묶음이 비어 있어 이 페이지에서는 더 내려갈 수 없다. 점수 기준으로 중단한 것이 아니다.</text><text x="45" y="137" font-size="25" text-anchor="start" font-weight="bold">fetch 9/40회     JEV 10회     허용 이탈 1회     최대 깊이 6</text><text x="45" y="178" font-size="20" text-anchor="start">주황 = 이번 대상  /  파랑 채움 = fetch 완료  /  빈 상자 = 미방문  /  +N = 발견했지만 아직 열지 않은 후보</text><text x="45" y="219" font-size="20" text-anchor="start" font-weight="bold">검색 10개</text><rect x="170.5" y="188.5" width="129" height="47" rx="7" fill="#e8f1fb" stroke="#3778b8" stroke-width="2"/><text x="235" y="219" font-size="20" text-anchor="middle">R1  0.81</text><rect x="315.5" y="188.5" width="129" height="47" rx="7" fill="#e8f1fb" stroke="#3778b8" stroke-width="2"/><text x="380" y="219" font-size="20" text-anchor="middle">R2  0.62</text><rect x="460.5" y="188.5" width="129" height="47" rx="7" fill="#e8f1fb" stroke="#3778b8" stroke-width="2"/><text x="525" y="219" font-size="20" text-anchor="middle">R3  0.52</text><rect x="605.5" y="188.5" width="129" height="47" rx="7" fill="#e8f1fb" stroke="#3778b8" stroke-width="2"/><text x="670" y="219" font-size="20" text-anchor="middle">R4  0.47</text><rect x="750.5" y="188.5" width="129" height="47" rx="7" fill="#e8f1fb" stroke="#3778b8" stroke-width="2"/><text x="815" y="219" font-size="20" text-anchor="middle">R5  0.43</text><rect x="895.5" y="188.5" width="129" height="47" rx="7" fill="#f2f3f5" stroke="#ccd2da" stroke-width="2"/><text x="960" y="219" font-size="20" text-anchor="middle">R6  0.38</text><rect x="1040.5" y="188.5" width="129" height="47" rx="7" fill="#f2f3f5" stroke="#ccd2da" stroke-width="2"/><text x="1105" y="219" font-size="20" text-anchor="middle">R7  0.37</text><rect x="1185.5" y="188.5" width="129" height="47" rx="7" fill="#f2f3f5" stroke="#ccd2da" stroke-width="2"/><text x="1250" y="219" font-size="20" text-anchor="middle">R8  0.31</text><rect x="1330.5" y="188.5" width="129" height="47" rx="7" fill="#f2f3f5" stroke="#ccd2da" stroke-width="2"/><text x="1395" y="219" font-size="20" text-anchor="middle">R9  0.29</text><rect x="1475.5" y="188.5" width="129" height="47" rx="7" fill="#f2f3f5" stroke="#ccd2da" stroke-width="2"/><text x="1540" y="219" font-size="20" text-anchor="middle">R10  0.19</text><text x="24" y="308" font-size="19" text-anchor="start" style="fill:#68778b">d1</text><line x1="67" y1="300" x2="1650" y2="300" stroke="#f0f2f5" stroke-width="2"/><text x="24" y="412" font-size="19" text-anchor="start" style="fill:#68778b">d2</text><line x1="67" y1="404" x2="1650" y2="404" stroke="#f0f2f5" stroke-width="2"/><text x="24" y="516" font-size="19" text-anchor="start" style="fill:#68778b">d3</text><line x1="67" y1="508" x2="1650" y2="508" stroke="#f0f2f5" stroke-width="2"/><text x="24" y="620" font-size="19" text-anchor="start" style="fill:#68778b">d4</text><line x1="67" y1="612" x2="1650" y2="612" stroke="#f0f2f5" stroke-width="2"/><text x="24" y="724" font-size="19" text-anchor="start" style="fill:#68778b">d5</text><line x1="67" y1="716" x2="1650" y2="716" stroke="#f0f2f5" stroke-width="2"/><text x="24" y="828" font-size="19" text-anchor="start" style="fill:#68778b">d6</text><line x1="67" y1="820" x2="1650" y2="820" stroke="#f0f2f5" stroke-width="2"/><line x1="695.0869565217392" y1="323" x2="565.5217391304349" y2="381" stroke="#c4cdd7" stroke-width="2"/><line x1="695.0869565217392" y1="323" x2="695.0869565217392" y2="381" stroke="#c4cdd7" stroke-width="2"/><line x1="1394.7391304347827" y1="323" x2="1265.1739130434785" y2="381" stroke="#c4cdd7" stroke-width="2"/><line x1="139