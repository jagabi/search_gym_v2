1fc" stroke="#3976ad" stroke-width="2"/><text x="695.0869565217392" y="401" font-size="17" text-anchor="middle" font-weight="bold">n02</text><text x="695.0869565217392" y="421" font-size="16" text-anchor="middle">0.18</text><text x="695.0869565217392" y="446" font-size="14" text-anchor="middle" style="fill:#677689">후보 없음</text><rect x="661.5869565217392" y="275.5" width="67" height="49" rx="7" fill="#e7f1fc" stroke="#3976ad" stroke-width="2"/><text x="695.0869565217392" y="297" font-size="17" text-anchor="middle" font-weight="bold">R3</text><text x="695.0869565217392" y="317" font-size="16" text-anchor="middle">0.52</text><rect x="1011.413043478261" y="275.5" width="67" height="49" rx="7" fill="#e7f1fc" stroke="#3976ad" stroke-width="2"/><text x="1044.913043478261" y="297" font-size="17" text-anchor="middle" font-weight="bold">R4</text><text x="1044.913043478261" y="317" font-size="16" text-anchor="middle">0.47</text><text x="1044.913043478261" y="342" font-size="14" text-anchor="middle" style="fill:#677689">후보 없음</text><rect x="1231.6739130434785" y="379.5" width="67" height="49" rx="7" fill="#e7f1fc" stroke="#3976ad" stroke-width="2"/><text x="1265.1739130434785" y="401" font-size="17" text-anchor="middle" font-weight="bold">n06</text><text x="1265.1739130434785" y="421" font-size="16" text-anchor="middle">0.28</text><text x="1265.1739130434785" y="446" font-size="14" text-anchor="middle" style="fill:#677689">후보 없음</text><rect x="1361.2391304347827" y="379.5" width="67" height="49" rx="7" fill="#e7f1fc" stroke="#d27816" stroke-width="2"/><text x="1394.7391304347827" y="401" font-size="17" text-anchor="middle" font-weight="bold">n07</text><text x="1394.7391304347827" y="421" font-size="16" text-anchor="middle">0.22</text><text x="1394.7391304347827" y="446" font-size="14" text-anchor="middle" style="fill:#677689">후보 없음</text><rect x="1361.2391304347827" y="275.5" width="67" height="49" rx="7" fill="#e7f1fc" stroke="#3976ad" stroke-width="2"/><text x="1394.7391304347827" y="297" font-size="17" text-anchor="middle" font-weight="bold">R5</text><text x="1394.7391304347827" y="317" font-size="16" text-anchor="middle">0.43</text><line x1="45" y1="886" x2="1655" y2="886" stroke="#c4cdd7" stroke-width="2"/><text x="45" y="925" font-size="25" text-anchor="start" font-weight="bold">이번 갈림길: n07의 자식 후보 · 부모 경로 이탈 1회</text><text x="45" y="977" font-size="23" text-anchor="start">자식 후보 없음. 이 경로는 여기서 끝난다.</text><text x="45" y="1110" font-size="24" text-anchor="start" font-weight="bold">다음 행동: R3 차례: n03 선택</text><text x="45" y="1160" font-size="19" text-anchor="start" style="fill:#68778b">후보 점수 묶음은 실제 로그 분포에서 재추출한 가상 값. 자식은 fetch 후 JEV 평가 때만 공개한다.</text><text x="45" y="1197" font-size="18" text-anchor="start" style="fill:#68778b">대기 후보는 트리에서 +N으로 묶고, 현재 갈림길의 개별 점수는 아래에 펼쳐 표시했다. 깊이 4~6은 분포 외삽이다.</text></svg>