<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1230" viewBox="0 0 1700 1230" role="img"><title>Action 53: JEV: n21에서 자식 후보 5개 확인</title><style>text{font-family:"Malgun Gothic",sans-serif;fill:#192a3d} .small{fill:#5b697b}</style><rect width="100%" height="100%" fill="#fff"/><text x="45" y="48" font-size="32" text-anchor="start" font-weight="bold">Action #053 / 127  ·  JEV: n21에서 자식 후보 5개 확인</text><text x="45" y="91" font-size="22" text-anchor="start">새 후보의 점수와 형제 순위를 알게 됐다. 후보를 발견한 것만으로 fetch 횟수는 늘지 않는다.</text><text x="45" y="137" font-size="25" text-anchor="start" font-weight="bold">fetch 16/40회     JEV 17회     허용 이탈 1회     최대 깊이 6</text><text x="45" y="178" font-size="20" text-anchor="start">주황 = 이번 대상  /  파랑 채움 = fetch 완료  /  빈 상자 = 미방문  /  +N = 발견했지만 아직 열지 않은 후보</text><text x="45" y="219" font-size="20" text-anchor="start" font-weight="bold">검색 10개</text><rect x="170.5" y="188.5" width="129" height="47" rx="7" fill="#e8f1fb" stroke="#3778b8" stroke-width="2"/><text x="235" y="219" font-size="20" text-anchor="middle">R1  0.81</text><rect x="315.5" y="188.5" width="129" height="47" rx="7" fill="#e8f1fb" stroke="#3778b8" stroke-width="2"/><text x="380" y="219" font-size="20" text-anchor="middle">R2  0.62</text><rect x="460.5" y="188.5" width="129" height="47" rx="7" fill="#e8f1fb" stroke="#3778b8" stroke-width="2"/><text x="525" y="219" font-size="20" text-anchor="middle">R3  0.52</text><rect x="605.5" y="188.5" width="129" height="47" rx="7" fill="#e8f1fb" stroke="#3778b8" stroke-width="2"/><text x="670" y="219" font-size="20" text-anchor="middle">R4  0.47</text><rect x="750.5" y="188.5" width="129" height="47" rx="7" fill="#e8f1fb" stroke="#3778b8" stroke-width="2"/><text x="815" y="219" font-size="20" text-anchor="middle">R5  0.43</text><rect x="895.5" y="188.5" width="129" height="47" rx="7" fill="#f2f3f5" stroke="#ccd2da" stroke-width="2"/><text x="960" y="219" font-size="20" text-anchor="middle">R6  0.38</text><rect x="1040.5" y="188.5" width="1