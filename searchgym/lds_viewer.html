<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>실제 LDS 탐색 — 행동별 SVG</title><style>
body{margin:0;font-family:system-ui,"Malgun Gothic",sans-serif;background:#f6f8fa;color:#172c40}nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px;background:white;position:sticky;top:0;border-bottom:1px solid #ccd4dd;z-index:1}button,input,select{font:inherit;padding:8px}select{max-width:min(620px,95vw)}input{width:65px}a{color:#215f9f}img{display:block;width:100%;height:auto;background:white}img.expanded{width:auto;min-width:100%}#status{font-variant-numeric:tabular-nums}
</style></head><body><nav><select id="search" aria-label="문항과 검색 선택"></select><button id="prev">← 이전</button><button id="next">다음 →</button><label>Action <input id="number" type="number" value="1" min="1"></label><span id="status" aria-live="polite"></span><a id="original" target="_blank">SVG 원본</a><a id="structure" target="_blank">구조 JSON</a></nav><img id="frame" alt="탐색 행동"><script>
const groups=__GROUPS__;const selector=document.getElementById('search'),number=document.getElementById('number'),frame=document.getElementById('frame');let gi=0,ai=0;
const zoom=document.createElement('button');zoom.id='zoom';zoom.textContent='크게 보기';zoom.setAttribute('aria-pressed','false');zoom.onclick=()=>{const expanded=frame.classList.toggle('expanded');zoom.textContent=expanded?'전체 맞춤':'크게 보기';zoom.setAttribute('aria-pressed',String(expanded))};document.querySelector('nav').append(zoom);
groups.forEach((g,i)=>{const o=document.createElement('option');o.value=i;o.textContent=g.label;selector.append(o)});
function show(group,action){if(!groups.length){document.getElementById('status').textContent='아직 기록이 없습니다';return}gi=Math.max(0,Math.min(groups.length-1,group));const g=groups[gi];ai=Math.max(0,Math.min(g.frames.length-1,action));const a=g.frames[ai];selector.value=gi;number.value=ai+1;number.max=g.frames.length;frame.src=a.path;frame.alt=a.title;document.getElementById('status').textContent='/ '+g.frames.length+' · fetch '+a.fetch+' · '+a.seconds+'초';document.getElementById('original').href=a.path;document.getElementById('structure').href=g.structure;document.getElementById('prev').disabled=ai===0;document.getElementById('next').disabled=ai===g.frames.length-1;history.replaceState(null,'','#'+gi+':'+ai)}
selector.onchange=()=>show(Number(selector.value),0);number.onchange=()=>show(gi,(Number(number.value)||1)-1);document.getElementById('prev').onclick=()=>show(gi,ai-1);document.getElementById('next').onclick=()=>show(gi,ai+1);document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();show(gi,ai+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(gi,ai-1)}});const start=location.hash.slice(1).split(':').map(Number);show(start[0]||0,start[1]||0);
</script></body></html>
